name = "facilisbot"
main = "src/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Static assets (admin panel + widget) served automatically
[assets]
directory = "./src/public"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "facilisbot-db"
database_id = "320299e2-2627-4cae-875e-0199f08621dd"

# KV Namespace for knowledge base documents
[[kv_namespaces]]
binding = "KV"
id = "e6c3c39c2bf347af82b381d4513bc4de"

# Public environment variables
[vars]
BOT_NAME = "Asistente Virtual"
